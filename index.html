<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Infinite Explorer — Solar System</title>
  <link rel="stylesheet" href="./src/style.css" />
</head>
<body>
  <main id="app">
    <header>
      <div>
        <p class="eyebrow">INFINITE EXPLORER</p>
        <h1>Explore the Solar System</h1>
        <p class="subtitle">Tap a planet to discover its world.</p>
      </div>
      <button id="reset" class="ghost">Reset view</button>
    </header>

    <section class="space" aria-label="Interactive solar system">
      <div class="sun" data-body="Sun"><span>☀</span></div>
      <div class="orbit o1"><button class="planet mercury" data-body="Mercury" aria-label="Mercury"></button></div>
      <div class="orbit o2"><button class="planet venus" data-body="Venus" aria-label="Venus"></button></div>
      <div class="orbit o3"><button class="planet earth" data-body="Earth" aria-label="Earth"></button></div>
      <div class="orbit o4"><button class="planet mars" data-body="Mars" aria-label="Mars"></button></div>
      <div class="orbit o5"><button class="planet jupiter" data-body="Jupiter" aria-label="Jupiter"></button></div>
      <div class="orbit o6"><button class="planet saturn" data-body="Saturn" aria-label="Saturn"></button></div>
      <div class="orbit o7"><button class="planet uranus" data-body="Uranus" aria-label="Uranus"></button></div>
      <div class="orbit o8"><button class="planet neptune" data-body="Neptune" aria-label="Neptune"></button></div>
      <div class="starfield"></div>
    </section>

    <aside id="info" class="info" aria-live="polite">
      <div class="info-icon" id="infoIcon">🌍</div>
      <div>
        <h2 id="infoTitle">Earth</h2>
        <p id="infoText">Our home planet. Click any planet to explore.</p>
      </div>
    </aside>
  </main>
  <script src="./src/app.js"></script>
</body>
</html>
